<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Crowd Collage</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --surface: #2d2d2d;
            --primary: #4f46e5;
            --text: #ffffff;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 30px; }

        .controls {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: inline-flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            border: 1px solid #444;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            border: none;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #555; cursor: not-allowed; }

        .status-bar {
            margin-top: 20px;
            font-family: monospace;
            background: #000;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            max-width: 600px;
            height: 100px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.9rem;
            border: 1px solid #333;
        }
        .status-entry { margin: 2px 0; border-bottom: 1px solid #222; }
        .status-success { color: #4ade80; }
        .status-info { color: #60a5fa; }
        .status-warn { color: #facc15; }

        #canvas-container {
            margin-top: 30px;
            overflow: auto;
            max-width: 100%;
            max-height: 70vh;
            border: 2px dashed #444;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }
        
        canvas {
            max-width: 100%;
            height: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Spinner */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>📸 Intelligent Crowd Collage</h1>
        <p>Uses AI to count people in photos. Images with more people are sized larger.</p>

        <div class="controls">
            <label class="btn">
                Select Images
                <input type="file" id="fileInput" multiple accept="image/*">
            </label>
            <button id="processBtn" class="btn" disabled>Generate Collage</button>
            <button id="downloadBtn" class="btn" style="background:#10b981; display:none;">Download High-Res</button>
            <div class="loader" id="loader"></div>
        </div>

        <div class="status-bar" id="statusBar">
            <div class="status-entry status-info">Waiting for AI models to load...</div>
        </div>

        <div id="canvas-container">
            <canvas id="outputCanvas"></canvas>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusBar = document.getElementById('statusBar');
        const canvas = document.getElementById('outputCanvas');
        const loader = document.getElementById('loader');
        const ctx = canvas.getContext('2d');

        let modelsLoaded = false;
        let imagesData = []; // Stores { imgElement, faceCount, width, height }

        // 1. Logger Utility
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `status-entry status-${type}`;
            div.textContent = `> ${msg}`;
            statusBar.appendChild(div);
            statusBar.scrollTop = statusBar.scrollHeight;
        }

        // 2. Initialize Face API
        async function loadModels() {
            try {
                loader.style.display = 'block';
                // Using Vlad Mandic's model path which is CORS friendly
                const modelPath = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                
                await faceapi.nets.tinyFaceDetector.loadFromUri(modelPath);
                // We don't need full landmarks, just detection for counting
                
                modelsLoaded = true;
                processBtn.disabled = false;
                loader.style.display = 'none';
                log("AI Models Loaded. Ready to process.", "success");
            } catch (error) {
                console.error(error);
                log("Error loading AI models. Check console.", "warn");
            }
        }
        
        loadModels();

        // 3. Handle File Selection
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                log(`${e.target.files.length} files selected.`);
            }
        });

        processBtn.addEventListener('click', async () => {
            const files = fileInput.files;
            if (files.length === 0) {
                alert("Please select images first.");
                return;
            }

            // Reset
            imagesData = [];
            downloadBtn.style.display = 'none';
            processBtn.disabled = true;
            loader.style.display = 'block';
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            log("Starting processing...", "info");

            try {
                // Process images sequentially to avoid memory crashes
                for (let i = 0; i < files.length; i++) {
                    await processImage(files[i], i + 1, files.length);
                }

                log("All images processed. Packing layout...", "success");
                packAndDraw();

            } catch (err) {
                console.error(err);
                log("Error during processing.", "warn");
            } finally {
                processBtn.disabled = false;
                loader.style.display = 'none';
            }
        });

        // 4. Analyze Single Image (Count Faces)
        function processImage(file, index, total) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = URL.createObjectURL(file);
                
                img.onload = async () => {
                    log(`Scanning image ${index}/${total} for faces...`);
                    
                    // Detect faces using TinyFaceDetector (faster)
                    // inputSize 512 is a balance between speed and accuracy
                    const detections = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 512 }));
                    const count = detections.length;

                    log(`- Detected ${count} people.`, count > 2 ? 'success' : 'info');

                    imagesData.push({
                        img: img,
                        faceCount: count,
                        // We will calculate final dimensions during packing
                        origW: img.width,
                        origH: img.height
                    });
                    resolve();
                };

                img.onerror = () => {
                    log(`Failed to load image ${index}`, "warn");
                    resolve();
                };
            });
        }

        // 5. Bin Packing & Rendering Algorithm
        function packAndDraw() {
            if (imagesData.length === 0) return;

            // --- A. Determine Scaling ---
            // Base size strategy: We want images to look good. 
            // Let's normalize distinct images to a "Base Width" of roughly 500px for 1 person.
            const BASE_WIDTH = 500;
            
            imagesData.forEach(item => {
                // Formula: Size Multiplier = 1 + (Faces * 0.2)
                // 0 or 1 face = 1.0x
                // 5 faces = 2.0x
                // Cap at 3.0x to prevent gigantic images
                let multiplier = 1 + (item.faceCount * 0.25);
                if (item.faceCount === 0) multiplier = 0.8; // Shrink empty landscapes/objects slightly to prioritize people
                if (multiplier > 3) multiplier = 3;

                const targetWidth = BASE_WIDTH * multiplier;
                const scale = targetWidth / item.origW;
                
                item.width = Math.floor(item.origW * scale);
                item.height = Math.floor(item.origH * scale);
            });

            // --- B. Sort for Packing ---
            // Sorting by height (descending) usually yields tighter packs in simple algorithms
            imagesData.sort((a, b) => b.height - a.height);

            // --- C. Calculate Layout (Shelf Algorithm) ---
            // We aim for a roughly square final canvas to look nice
            const totalArea = imagesData.reduce((acc, item) => acc + (item.width * item.height), 0);
            const canvasWidth = Math.floor(Math.sqrt(totalArea) * 1.2); // Add 20% width buffer to bias towards landscape
            
            let x = 0;
            let y = 0;
            let rowHeight = 0;
            let finalCanvasHeight = 0;

            imagesData.forEach(item => {
                // If this image doesn't fit in the current row, move to next row
                if (x + item.width > canvasWidth) {
                    y += rowHeight;
                    x = 0;
                    rowHeight = 0; // Reset row height for new row
                }

                item.x = x;
                item.y = y;

                // Update current row stats
                x += item.width;
                if (item.height > rowHeight) rowHeight = item.height;
                
                // Track total height needed
                if (y + rowHeight > finalCanvasHeight) finalCanvasHeight = y + rowHeight;
            });

            // --- D. Draw ---
            canvas.width = canvasWidth;
            canvas.height = finalCanvasHeight;
            
            // Fill Background
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            imagesData.forEach(item => {
                ctx.drawImage(item.img, item.x, item.y, item.width, item.height);
                
                // Optional: Draw a thin border to separate images
                ctx.strokeStyle = "rgba(255,255,255,0.5)";
                ctx.lineWidth = 2;
                ctx.strokeRect(item.x, item.y, item.width, item.height);
            });

            log("Collage generated successfully!", "success");
            downloadBtn.style.display = 'inline-block';
        }

        // 6. Download Feature
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'smart-collage.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        });

    </script>
</body>
</html>
