
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Fit Crowd Collage</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --surface: #2d2d2d;
            --primary: #4f46e5;
            --text: #ffffff;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 30px; }

        .controls {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: inline-flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            border: 1px solid #444;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            border: none;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #555; cursor: not-allowed; }

        .status-bar {
            margin-top: 20px;
            font-family: monospace;
            background: #000;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            max-width: 600px;
            height: 100px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.9rem;
            border: 1px solid #333;
        }
        .status-entry { margin: 2px 0; border-bottom: 1px solid #222; }
        .status-success { color: #4ade80; }
        .status-info { color: #60a5fa; }
        .status-warn { color: #facc15; }

        #canvas-container {
            margin-top: 30px;
            overflow: auto;
            max-width: 100%;
            max-height: 70vh;
            border: 2px dashed #444;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }
        
        canvas {
            max-width: 100%;
            height: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Spinner */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>📸 Perfect Fit Collage</h1>
        <p>AI-sized images + Binary Tree Packing for zero gaps.</p>

        <div class="controls">
            <label class="btn">
                Select Images
                <input type="file" id="fileInput" multiple accept="image/*">
            </label>
            <button id="processBtn" class="btn" disabled>Generate Collage</button>
            <button id="downloadBtn" class="btn" style="background:#10b981; display:none;">Download High-Res</button>
            <div class="loader" id="loader"></div>
        </div>

        <div class="status-bar" id="statusBar">
            <div class="status-entry status-info">Waiting for AI models to load...</div>
        </div>

        <div id="canvas-container">
            <canvas id="outputCanvas"></canvas>
        </div>
    </div>

    <script>
        // --- 1. Growing Bin Packer Algorithm (The "Perfect" Fit Logic) ---
        class GrowingPacker {
            constructor() {
                this.root = null;
            }

            fit(blocks) {
                // Ensure blocks are sorted by max dimension descending for best fit
                blocks.sort((a, b) => Math.max(b.w, b.h) - Math.max(a.w, a.h));
                
                let len = blocks.length;
                let w = len > 0 ? blocks[0].w : 0;
                let h = len > 0 ? blocks[0].h : 0;

                this.root = { x: 0, y: 0, w: w, h: h };

                for (let n = 0; n < len; n++) {
                    let block = blocks[n];
                    let node = this.findNode(this.root, block.w, block.h);
                    if (node) {
                        block.fit = this.splitNode(node, block.w, block.h);
                    } else {
                        block.fit = this.growNode(block.w, block.h);
                    }
                }
            }

            findNode(root, w, h) {
                if (root.used)
                    return this.findNode(root.right, w, h) || this.findNode(root.down, w, h);
                else if ((w <= root.w) && (h <= root.h))
                    return root;
                else
                    return null;
            }

            splitNode(node, w, h) {
                node.used = true;
                node.down  = { x: node.x,     y: node.y + h, w: node.w,     h: node.h - h };
                node.right = { x: node.x + w, y: node.y,     w: node.w - w, h: h          };
                return node;
            }

            growNode(w, h) {
                let canGrowDown  = (w <= this.root.w);
                let canGrowRight = (h <= this.root.h);

                let shouldGrowRight = canGrowRight && (this.root.h >= (this.root.w + w));
                let shouldGrowDown  = canGrowDown  && (this.root.w >= (this.root.h + h));

                if (shouldGrowRight) return this.growRight(w, h);
                else if (shouldGrowDown) return this.growDown(w, h);
                else if (canGrowRight) return this.growRight(w, h);
                else if (canGrowDown) return this.growDown(w, h);
                else return null; // Should be rare given logic
            }

            growRight(w, h) {
                this.root = {
                    used: true,
                    x: 0, y: 0,
                    w: this.root.w + w,
                    h: this.root.h,
                    down: this.root,
                    right: { x: this.root.w, y: 0, w: w, h: this.root.h }
                };
                let node = this.findNode(this.root, w, h);
                if (node) return this.splitNode(node, w, h);
                else return null;
            }

            growDown(w, h) {
                this.root = {
                    used: true,
                    x: 0, y: 0,
                    w: this.root.w,
                    h: this.root.h + h,
                    down: { x: 0, y: this.root.h, w: this.root.w, h: h },
                    right: this.root
                };
                let node = this.findNode(this.root, w, h);
                if (node) return this.splitNode(node, w, h);
                else return null;
            }
        }


        // --- 2. Application Logic ---
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusBar = document.getElementById('statusBar');
        const canvas = document.getElementById('outputCanvas');
        const loader = document.getElementById('loader');
        const ctx = canvas.getContext('2d');

        let modelsLoaded = false;
        let imagesData = []; 

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `status-entry status-${type}`;
            div.textContent = `> ${msg}`;
            statusBar.appendChild(div);
            statusBar.scrollTop = statusBar.scrollHeight;
        }

        async function loadModels() {
            try {
                loader.style.display = 'block';
                const modelPath = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await faceapi.nets.tinyFaceDetector.loadFromUri(modelPath);
                modelsLoaded = true;
                processBtn.disabled = false;
                loader.style.display = 'none';
                log("AI Models Loaded. Ready.", "success");
            } catch (error) {
                console.error(error);
                log("Error loading AI models. Check console.", "warn");
            }
        }
        
        loadModels();

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) log(`${e.target.files.length} files selected.`);
        });

        processBtn.addEventListener('click', async () => {
            const files = fileInput.files;
            if (files.length === 0) {
                alert("Please select images first.");
                return;
            }

            imagesData = [];
            downloadBtn.style.display = 'none';
            processBtn.disabled = true;
            loader.style.display = 'block';
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            log("Starting processing...", "info");

            try {
                for (let i = 0; i < files.length; i++) {
                    await processImage(files[i], i + 1, files.length);
                }
                log("Packing images tight...", "success");
                packAndDraw();
            } catch (err) {
                console.error(err);
                log("Error during processing.", "warn");
            } finally {
                processBtn.disabled = false;
                loader.style.display = 'none';
            }
        });

        function processImage(file, index, total) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = URL.createObjectURL(file);
                
                img.onload = async () => {
                    log(`Scanning image ${index}/${total}...`);
                    // Detect faces
                    const detections = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 512 }));
                    const count = detections.length;

                    log(`- Detected ${count} people.`, count > 2 ? 'success' : 'info');

                    imagesData.push({
                        img: img,
                        faceCount: count,
                        origW: img.width,
                        origH: img.height,
                        // Initialize pack variables
                        w: 0, h: 0 
                    });
                    resolve();
                };

                img.onerror = () => {
                    log(`Failed to load image ${index}`, "warn");
                    resolve();
                };
            });
        }

        function packAndDraw() {
            if (imagesData.length === 0) return;

            // 1. Calculate Dimensions based on Face Count
            const BASE_WIDTH = 500;
            imagesData.forEach(item => {
                // Size Multiplier
                let multiplier = 1 + (item.faceCount * 0.35); // Increased weight for groups
                if (item.faceCount === 0) multiplier = 0.8;
                if (multiplier > 3.5) multiplier = 3.5;

                const targetWidth = BASE_WIDTH * multiplier;
                const scale = targetWidth / item.origW;
                
                item.w = Math.floor(item.origW * scale);
                item.h = Math.floor(item.origH * scale);
            });

            // 2. Initialize the Growing Packer
            const packer = new GrowingPacker();
            
            // 3. Run Packing (This modifies item.fit inside imagesData)
            packer.fit(imagesData);

            // 4. Determine final canvas size based on the packer root
            const finalW = packer.root.w;
            const finalH = packer.root.h;

            canvas.width = finalW;
            canvas.height = finalH;

            // 5. Draw
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            imagesData.forEach(item => {
                if (item.fit) {
                    ctx.drawImage(item.img, item.fit.x, item.fit.y, item.w, item.h);
                    
                    // Optional: Stylish border
                    ctx.strokeStyle = "#1a1a1a";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(item.fit.x, item.fit.y, item.w, item.h);
                } else {
                    log("Warning: An image failed to pack.", "warn");
                }
            });

            log(`Collage generated! (${finalW}x${finalH}px)`, "success");
            downloadBtn.style.display = 'inline-block';
        }

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'perfect-collage.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        });

    </script>
</body>
</html>
